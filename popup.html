<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 450px;
      min-height: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
    }
    
    .header {
      padding: 16px;
      background: #2d2d2d;
      border-bottom: 1px solid #3d3d3d;
    }
    
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .header .count {
      background: #4CAF50;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
    }
    
    .actions {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #3d3d3d;
    }
    
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      font-weight: 500;
    }
    
    button:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .btn-primary {
      background: #4CAF50;
      color: white;
      flex: 1;
    }

    /* Overrides the generic disabled fade above — this isn't "unavailable",
       it's "done", so it should read as complete rather than greyed-out. */
    .btn-primary.btn-downloaded:disabled {
      background: #2e2e2e;
      color: #8bc98f;
      border: 1px solid #3d5a3f;
      opacity: 1;
      cursor: default;
    }
    
    .btn-secondary {
      background: #3d3d3d;
      color: #fff;
    }
    
    .btn-danger {
      background: #f44336;
      color: white;
    }
    
    .external-panel {
      padding: 12px 16px;
      border-bottom: 1px solid #3d3d3d;
      background: #212121;
    }

    .external-label {
      font-size: 11px;
      color: #888;
      margin-bottom: 8px;
    }

    .external-row {
      display: flex;
      gap: 8px;
    }

    .external-row input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid #3d3d3d;
      border-radius: 6px;
      background: #1a1a1a;
      color: #fff;
      font-size: 12px;
    }

    .external-row input:focus {
      outline: none;
      border-color: #4CAF50;
    }

    .external-row button {
      flex: 0 0 auto;
    }

    .external-panel .progress-container {
      margin-top: 8px;
    }

    /* Diagnostics log — all three contexts in one place */
    .log-panel {
      display: none;
      border-bottom: 1px solid #3d3d3d;
      background: #131313;
    }

    .log-panel.open { display: block; }

    .log-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-bottom: 1px solid #2d2d2d;
      font-size: 11px;
      color: #888;
    }

    .log-toolbar button { padding: 4px 8px; font-size: 11px; }

    .log-body {
      max-height: 260px;
      overflow-y: auto;
      padding: 6px 0;
      font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
      font-size: 11px;
      line-height: 1.5;
    }

    .log-row {
      display: flex;
      gap: 8px;
      padding: 2px 12px;
      border-left: 2px solid transparent;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-row:hover { background: #1c1c1c; }
    .log-row.warn  { border-left-color: #FFC107; color: #ffd75e; }
    .log-row.error { border-left-color: #f44336; color: #ff8a80; }

    .log-time { color: #555; flex-shrink: 0; }
    .log-src {
      color: #4CAF50;
      flex-shrink: 0;
      opacity: .8;
      min-width: 62px;
    }
    .log-src.offscreen { color: #2196F3; }
    .log-msg { flex: 1; }

    .log-empty { padding: 20px 12px; color: #666; text-align: center; font-size: 12px; }

    .stream-list {
      max-height: 450px;
      overflow-y: auto;
    }
    
    .stream-item {
      padding: 16px;
      border-bottom: 1px solid #2d2d2d;
    }
    
    .stream-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    
    .stream-url {
      font-size: 12px;
      color: #aaa;
      word-break: break-all;
      flex: 1;
      margin-right: 8px;
    }
    
    .stream-meta {
      font-size: 11px;
      color: #666;
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .stream-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .stream-thumb {
      width: 120px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 6px;
      background: #2d2d2d;
      flex-shrink: 0;
    }

    /* Hover pop for generated thumbnails (img only, not the placeholder) */
    img.stream-thumb {
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
    }

    img.stream-thumb:hover {
      transform: scale(1.5);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      filter: brightness(1.15);
      position: relative;
      z-index: 10;
    }

    .stream-thumb-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      opacity: 0.4;
    }

    .stream-body {
      flex: 1;
      min-width: 0;
    }
    
    .stream-size {
      font-size: 11px;
      color: #999;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .size-value {
      color: #4CAF50;
      font-weight: 600;
    }

    .size-warn {
      color: #FFC107;
    }

    .size-pending {
      color: #666;
      font-style: italic;
    }

    .size-hint {
      flex-basis: 100%;
      color: #FFC107;
      background: rgba(255, 193, 7, 0.12);
      border-radius: 4px;
      padding: 6px 8px;
      margin-top: 2px;
    }

    .download-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .handoff-btn {
      display: block;
      margin-top: 8px;
      width: 100%;
    }
    
    .progress-container {
      background: #2d2d2d;
      border-radius: 4px;
      padding: 12px;
      display: none;
    }
    
    .progress-container.active {
      display: block;
    }
    
    .progress-bar {
      height: 4px;
      background: #3d3d3d;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    
    .progress-fill {
      height: 100%;
      background: #4CAF50;
      transition: width 0.3s ease;
    }
    
    .progress-text {
      font-size: 11px;
      color: #aaa;
      display: flex;
      justify-content: space-between;
    }
    
    .quality-badge {
      background: #2196F3;
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
    }
    
    .empty-state {
      padding: 60px 16px;
      text-align: center;
      color: #666;
    }
    
    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.3;
    }
    
    .status-message {
      font-size: 12px;
      padding: 8px;
      border-radius: 4px;
      margin-top: 8px;
    }
    
    .status-success {
      background: rgba(76, 175, 80, 0.2);
      color: #4CAF50;
    }
    
    .status-error {
      background: rgba(244, 67, 54, 0.2);
      color: #f44336;
    }

    .status-warn {
      background: rgba(255, 193, 7, 0.15);
      color: #FFC107;
    }

  </style>
</head>
<body>
  <div class="header">
    <h1>
      <span>🎬</span>
      Himitsu
      <span class="count" id="streamCount">0</span>
    </h1>
  </div>
  
  <div class="actions">
    <button class="btn-secondary" id="refreshBtn">🔄 Refresh</button>
    <button class="btn-secondary" id="clearBtn">🗑️ Clear</button>
    <button class="btn-secondary" id="logsBtn">📋 Logs</button>
  </div>

  <div class="log-panel" id="logPanel">
    <div class="log-toolbar">
      <span id="logCount">0 entries</span>
      <div style="flex:1"></div>
      <button class="btn-secondary" id="logRefresh">Refresh</button>
      <button class="btn-secondary" id="logCopy">Copy all</button>
      <button class="btn-secondary" id="logClear">Clear</button>
    </div>
    <div class="log-body" id="logBody"></div>
  </div>

  <div class="external-panel">
    <div class="external-label">External downloader (requires local helper)</div>
    <div class="external-row">
      <input type="url" id="externalUrl" placeholder="Paste a video page URL…">
      <button class="btn-primary" id="externalBtn">Fetch</button>
    </div>
    <div class="progress-container" id="externalProgress">
      <div class="progress-bar"><div class="progress-fill" style="width: 0%"></div></div>
      <div class="progress-text">
        <span class="progress-status">Starting…</span>
        <span class="progress-percent">0%</span>
      </div>
    </div>
    <div class="status-message" id="externalStatus" style="display: none;"></div>
  </div>
  
  <div id="streamList" class="stream-list">
    <!-- Streams populated here -->
  </div>
  <script src="popup.js"></script>
</body>
</html>
